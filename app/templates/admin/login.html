{% extends "base.html" %}
{% block title %}Admin Login - Kentaro{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-10 px-4">
  <div class="max-w-md w-full">

    <div class="bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-3xl overflow-hidden shadow-xl">

      <!-- Header Stripe -->
      <div class="bg-black dark:bg-white px-8 py-7">
        <p class="text-xs font-bold uppercase tracking-widest text-gray-400 dark:text-gray-500 mb-1">System Portal</p>
        <h1 class="text-2xl font-black text-white dark:text-black leading-tight">Admin Authentication</h1>
        <p class="text-xs text-gray-300 dark:text-gray-600 mt-1">Sign in with administrator credentials</p>
      </div>

      <div class="p-8">
        <form method="POST" action="{{ url_for('admin.login') }}" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-gray-900 dark:text-gray-100 mb-2">Admin Email</label>
            <input type="email" name="email" placeholder="admin@kentaro.test" required
                   class="w-full px-4 py-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-sm font-mono text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-900 dark:text-gray-100 mb-2">Password</label>
            <div class="relative">
              <input type="password" name="password" id="adminPwd" placeholder="••••••••" required
                     class="w-full px-4 py-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white pr-10">
              <button type="button" onclick="togglePassword('adminPwd', 'adminPwdToggleBtn')" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-500 hover:text-black dark:hover:text-white" id="adminPwdToggleBtn">👁️</button>
            </div>
          </div>

          <button type="submit"
                  class="flex items-center justify-center gap-2 w-full bg-black dark:bg-white text-white dark:text-black font-bold py-3.5 px-4 rounded-2xl text-sm hover:opacity-80 transition-opacity shadow-md">
            <span></span> Authenticate &amp; Access Panel
          </button>
        </form>

        <div class="mt-6 pt-5 border-t border-gray-100 dark:border-gray-800 flex flex-col items-center gap-2">
          <a href="{{ url_for('auth.register_admin') }}" class="text-xs font-bold text-red-600 dark:text-red-400 hover:underline">
            + Register New Admin Account
          </a>
          <a href="{{ url_for('main.index') }}" class="text-xs font-semibold text-gray-500 hover:text-black dark:text-gray-400 dark:hover:text-white transition">
            &larr; Return to Public Platform
          </a>
        </div>
      </div>

    </div>

  </div>
</div>
{% endblock %}
