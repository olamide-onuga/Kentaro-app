<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance - Kentaro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-red': '#D92D3A',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-gray-900 border border-gray-800 rounded-3xl p-8 sm:p-10 shadow-2xl text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-red/10 border border-brand-red/20 flex items-center justify-center text-3xl">
            🛠️
        </div>
        
        <div class="space-y-2">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">Under Scheduled Maintenance</h1>
            <p class="text-sm text-gray-400 leading-relaxed">
                {{ maintenance_message|default('Kentaro is currently undergoing scheduled platform upgrades and maintenance. We will be back online shortly.') }}
            </p>
        </div>

        <div class="p-4 rounded-2xl bg-gray-950/60 border border-gray-800/80 text-xs text-gray-400 space-y-1">
            <p class="font-semibold text-gray-300">Need urgent assistance?</p>
            <p>Reach out to our support desk: <a href="mailto:support@kentaro.app" class="text-brand-red hover:underline font-medium">support@kentaro.app</a></p>
        </div>

        <div class="pt-2 border-t border-gray-800/60 flex items-center justify-between text-xs text-gray-500">
            <span>&copy; 2026 Kentaro</span>
            <a href="/admin/login" class="hover:text-gray-300 transition-colors">Admin Login &rarr;</a>
        </div>
    </div>
</body>
</html>
