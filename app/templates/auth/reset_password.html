{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-black p-8 border border-gray-200 dark:border-gray-800 rounded-lg shadow-sm dark:shadow-gray-900/50">
  <h2 class="text-2xl font-bold mb-6 text-center">Reset Password</h2>
  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
    <div class="mb-4">
      <label class="block text-gray-700 dark:text-gray-300 mb-1" for="password">New Password</label>
      <div class="relative">
        <input class="w-full border rounded px-3 py-2 pr-10 border-gray-300 dark:border-gray-700 dark:bg-gray-900 text-gray-900 dark:text-gray-100" type="password" name="password" id="password" required minlength="6" pattern="(?=.*[0-9])(?=.*[a-zA-Z]).{6,}" title="Password must be at least 6 characters and contain both letters and numbers.">
        <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">Must be at least 6 characters with both letters and numbers.</p>
        <button type="button" onclick="togglePassword('password', 'pwdToggleBtn1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-500 hover:text-black dark:hover:text-white" id="pwdToggleBtn1">👁️</button>
      </div>
    </div>
    <div class="mb-6">
      <label class="block text-gray-700 dark:text-gray-300 mb-1" for="confirm_password">Confirm New Password</label>
      <div class="relative">
        <input class="w-full border rounded px-3 py-2 pr-10 border-gray-300 dark:border-gray-700 dark:bg-gray-900 text-gray-900 dark:text-gray-100" type="password" name="confirm_password" id="confirm_password" required minlength="6">
        <button type="button" onclick="togglePassword('confirm_password', 'pwdToggleBtn2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-500 hover:text-black dark:hover:text-white" id="pwdToggleBtn2">👁️</button>
      </div>
    </div>
    <button class="w-full bg-blue-600 text-white dark:text-black py-2 rounded hover:bg-blue-700" type="submit">Reset Password</button>
  </form>
  <p class="mt-4 text-center text-sm">
    Remembered? <a href="{{ url_for('auth.login') }}" class="text-blue-500 underline">Log in</a>
  </p>
</div>
{% endblock %}
