{% extends "base.html" %}

{% block title %}Log In - Kentaro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-white dark:bg-kn-card-dark p-8 sm:p-10 border border-kn-border dark:border-kn-border-dark rounded-3xl shadow-sm">
    <div class="text-center mb-8">
        <span class="inline-block text-xs font-black tracking-widest uppercase text-brand-red dark:text-brand-red-dark mb-2">Member Access</span>
        <h2 class="text-3xl font-black text-kn-text dark:text-kn-text-dark tracking-tight">Welcome Back</h2>
        <p class="text-xs text-kn-muted dark:text-kn-muted-dark mt-1">Log in to continue your coaching and workouts</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-kn-text dark:text-kn-text-dark mb-1" for="email">
                Email Address
            </label>
            <input class="input-line" type="email" name="email" id="email" placeholder="you@domain.com" required autocomplete="email">
        </div>

        <div>
            <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-bold uppercase tracking-wider text-kn-text dark:text-kn-text-dark" for="password">
                    Password
                </label>
                <a href="{{ url_for('auth.forgot_password') }}" class="text-[11px] font-semibold text-kn-muted dark:text-kn-muted-dark hover:text-brand-red dark:hover:text-brand-red-dark transition">
                    Forgot?
                </a>
            </div>
            <div class="relative">
                <input class="input-line pr-10" type="password" name="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" onclick="togglePassword('password', 'pwdToggleBtn')" class="absolute right-1 top-1/2 -translate-y-1/2 text-sm p-1 text-kn-muted hover:text-kn-text dark:hover:text-kn-text-dark transition" id="pwdToggleBtn" title="Toggle password visibility">
                    👁️
                </button>
            </div>
        </div>

        <button type="submit" class="w-full btn-primary-red py-3 px-4 rounded-xl font-bold text-sm shadow-md transition">
            Log In
        </button>
    </form>

    <div class="text-center mt-8 pt-6 border-t border-kn-border dark:border-kn-border-dark">
        <p class="text-xs text-kn-muted dark:text-kn-muted-dark">
            Don't have an account yet?
            <a href="{{ url_for('auth.register_choice') }}" class="font-bold text-brand-red dark:text-brand-red-dark hover:underline ml-1">
                Create Account
            </a>
        </p>
    </div>
</div>
{% endblock %}
