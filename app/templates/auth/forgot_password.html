{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-black p-8 border border-gray-200 dark:border-gray-800 rounded-lg shadow-sm dark:shadow-gray-900/50">
  <h2 class="text-2xl font-bold mb-6 text-center">Forgot Password</h2>
  <form method="post" action="{{ url_for('auth.forgot_password') }}">
    <div class="mb-4">
      <label class="block text-gray-700 dark:text-gray-300" for="email">Email</label>
      <input class="w-full border rounded px-3 py-2" type="email" name="email" id="email" required>
    </div>
    <button class="w-full bg-blue-600 text-white dark:text-black py-2 rounded hover:bg-blue-700" type="submit">Send Reset Link</button>
  </form>
  <p class="mt-4 text-center text-sm">
    Remembered? <a href="{{ url_for('auth.login') }}" class="text-blue-500 underline">Log in</a>
  </p>
</div>
{% endblock %}
